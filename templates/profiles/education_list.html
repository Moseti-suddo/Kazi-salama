<h1>Education</h1>

<ul>
    {% for education in education_entries %}
        <li>
            {{ education.institution }} —
            {{ education.qualification }} —
            {{ education.field_of_study }}
        </li>
    {% empty %}
        <li>No education entries yet.</li>
    {% endfor %}
</ul>

<h2>Add education</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save education</button>
</form>
