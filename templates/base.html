{% load static %}<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Kazi Salama{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #eef0e8;
            --panel: #f8f7f2;
            --line: #e2e4da;
            --ink: #1a1f1c;
            --muted: #6b726c;
            --green: #1f5a3f;
            --green-tint: #dfeadf;
            --coral: #e5532d;
            --coral-tint: #fbe3dc;
            --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
            --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
        h1, h2, h3 { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; margin: 0 0 8px; }
        h1 { font-size: 2.4rem; line-height: 1.1; }
        h2 { font-size: 1.6rem; margin-top: 32px; }
        .lead { color: var(--muted); margin: 0 0 24px; }

        /* Layout */
        .shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
        body.guest .shell { grid-template-columns: 1fr; place-items: center; }
        .sidebar { padding: 24px 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
        .brand { font-family: var(--serif); font-size: 1.7rem; padding: 0 12px 24px; color: var(--green); text-decoration: none; }
        .navlink { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 500; background: none; border: 0; font: inherit; width: 100%; cursor: pointer; text-align: left; }
        .navlink:hover { background: var(--panel); }
        .navlink.active { background: var(--green-tint); color: var(--green); }
        .navlink svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .sidebar form { margin: auto 0 0; }
        .content { padding: 40px 48px; max-width: 880px; width: 100%; }
        body.guest .content { max-width: 440px; }

        /* Panels */
        .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 28px; }

        /* Forms (Django's as_p output) */
        form p { margin: 0 0 16px; }
        label { display: block; font-weight: 500; margin-bottom: 6px; }
        input[type=text], input[type=password], input[type=email], input[type=url], input[type=date], input[type=number], select, textarea {
            width: 100%; padding: 11px 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; font: inherit; color: var(--ink);
        }
        input:focus, select:focus, textarea:focus { outline: 2px solid var(--green); outline-offset: 1px; border-color: transparent; }
        .helptext { display: block; color: var(--muted); font-size: .85rem; margin-top: 4px; }
        .errorlist { color: var(--coral); list-style: none; padding: 0; margin: 0 0 6px; font-size: .9rem; }
        button[type=submit] { background: var(--green); color: #fff; border: 0; padding: 11px 24px; border-radius: 999px; font: inherit; font-weight: 500; cursor: pointer; }
        button[type=submit]:hover { background: #17462f; }

        /* Lists inside content */
        .content ul { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 8px; }
        .content ul li { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
        .msg-error { background: var(--coral-tint); color: #9c2f10; padding: 10px 14px; border-radius: 12px; margin-bottom: 16px; }

        @media (max-width: 760px) {
            .shell { grid-template-columns: 1fr; }
            .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); }
            .brand { padding: 0 12px; width: 100%; }
            .content { padding: 24px 16px; }
        }
    </style>
</head>
<body class="{% if user.is_authenticated %}app{% else %}guest{% endif %}">
<div class="shell">
    {% if user.is_authenticated %}
    <aside class="sidebar">
        <a class="brand" href="{% url 'profile_edit' %}">Kazi Salama</a>

        <a class="navlink {% if request.resolver_match.url_name == 'profile_edit' %}active{% endif %}" href="{% url 'profile_edit' %}">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Profile
        </a>
        <a class="navlink {% if request.resolver_match.url_name == 'education_list' %}active{% endif %}" href="{% url 'education_list' %}">
            <svg viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
            Education
        </a>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="navlink">
                <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                Sign out
            </button>
        </form>
    </aside>
    {% endif %}

    <main class="content">
        <div class="panel">
            {% block content %}{% endblock %}
        </div>
    </main>
</div>
</body>
</html>
