{% extends "base.html" %}

{% block title %}Sign in | Kazi Salama{% endblock %}

{% block content %}
<h1>Sign in to Kazi Salama</h1>

{% if form.errors %}
    <p class="msg-error">Invalid username or password.</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
</form>

<p>New to Kazi Salama? <a href="{% url 'register' %}">Create an account</a></p>

{% endblock %}
